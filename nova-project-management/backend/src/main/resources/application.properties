spring.application.name=nova-backend
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/nova_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=YOUR_MYSQL_PASSWORD

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

app.jwt.secret=change-this-secret-key-to-a-long-random-value-for-production
app.jwt.expiration=86400000

spring.jackson.serialization.write-dates-as-timestamps=false
